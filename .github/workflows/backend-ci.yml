name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend
      - name: Theme, localization and layout regressions
        working-directory: frontend
        run: pnpm exec vitest run src/utils/__tests__/theme.spec.ts src/utils/__tests__/branding.spec.ts src/components/common/__tests__/ThemeToggle.spec.ts src/views/__tests__/HomeView.compact.spec.ts
      - name: Production frontend build
        working-directory: frontend
        run: pnpm run build

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend

  security:
    uses: ./.github/workflows/security-scan.yml

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record database migration compatibility
        id: schema
        run: echo "fingerprint=$(find backend/migrations -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Build the exact application revision
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ghcr.io/slothwatching/sub9api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Slothwatching/sub9api
            org.opencontainers.image.revision=${{ github.sha }}
            io.sub9api.migrations=${{ steps.schema.outputs.fingerprint }}
          build-args: |
            COMMIT=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-ready:
    if: always()
    needs: [shell, test, frontend, golangci-lint, security, image]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required checks failed: ' + ', '.join(failed))
          PYCODE

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [release-ready, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: sub9api-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in with the production federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy immutable image with server-side backup and health checks
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.AZURE_VM_NAME }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          script="/opt/sub9api/bin/deploy.sh ghcr.io/slothwatching/sub9api@$IMAGE_DIGEST $SOURCE_SHA"
          az vm run-command invoke --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" \
            --command-id RunShellScript --scripts "$script" --output json > result.json
          python3 - <<'PYCODE'
          import json
          result = json.load(open('result.json'))
          messages = '\n'.join(v.get('message', '') for v in result.get('value', []))
          print(messages)
          if 'SUB9API_DEPLOY_OK' not in messages:
              raise SystemExit('Server did not confirm a healthy deployment')
          PYCODE
      - name: Check public HTTPS
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: curl --fail --silent --show-error --retry 6 --retry-delay 10 "$SITE_URL/health"
